name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pyinstaller==6.15.0 cryptography==45.0.0

      - name: Build exe
        run: pyinstaller vivo-decryptor.spec --noconfirm --clean

      - name: Compute SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\VivoDecryptor.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $h"
          "$h *VivoDecryptor.exe" | Out-File -FilePath dist\SHA256SUMS -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: VivoDecryptor-windows
          path: |
            dist/VivoDecryptor.exe
            dist/SHA256SUMS
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VivoDecryptor.exe
            dist/SHA256SUMS
